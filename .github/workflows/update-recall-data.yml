name: Update recall data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/update-recall-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: recall-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch FDA, FSIS, and map data
        run: python scripts/update_data.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/recalls.json data/us-states.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "food-recall-wall-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/recalls.json data/us-states.json
          git commit -m "Refresh recall data"
          git push
